<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | TEKVANCE</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .error-page{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:40px 24px;
    background: radial-gradient(ellipse at 50% -10%, var(--navy-700) 0%, var(--navy-900) 55%, var(--navy-950) 100%);
  }
  .error-code{
    font-size: clamp(5rem, 15vw, 9rem);
    font-weight:800; line-height:1;
    background: linear-gradient(135deg, var(--blue-300), var(--blue-500));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:10px;
  }
  .error-title{ font-size: clamp(1.4rem, 3vw, 2rem); color:#fff; font-weight:700; margin-bottom:14px; }
  .error-text{ color: var(--grey-400); max-width:480px; margin:0 auto 32px; font-size:1rem; }
  .error-actions{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  .error-logo{ width:56px; height:56px; border-radius:14px; margin:0 auto 30px; box-shadow:0 0 30px rgba(41,182,246,.4); }
</style>
</head>
<body>

<div class="error-page">
  <div>
    <img src="assets/logo-icon.jpg" alt="TEKVANCE" class="error-logo">
    <div class="error-code">404</div>
    <h1 class="error-title" data-en="Page Not Found" data-ar="الصفحة غير موجودة">Page Not Found</h1>
    <p class="error-text" data-en="Sorry, the page you're looking for doesn't exist or may have been moved." data-ar="عذرًا، الصفحة اللي بتدور عليها مش موجودة أو ممكن تكون اتنقلت.">Sorry, the page you're looking for doesn't exist or may have been moved.</p>
    <div class="error-actions">
      <a href="index.html" class="btn btn-primary" data-en="Back to Home" data-ar="الرجوع للرئيسية">Back to Home</a>
      <a href="index.html#contact" class="btn btn-outline" data-en="Contact Us" data-ar="تواصل معنا">Contact Us</a>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    var htmlRoot = document.getElementById('htmlRoot');
    var savedLang = localStorage.getItem('tekvance_lang');
    if (savedLang === 'ar') {
      htmlRoot.setAttribute('lang', 'ar');
      htmlRoot.setAttribute('dir', 'rtl');
      document.querySelectorAll('[data-en][data-ar]').forEach(function(el){
        el.textContent = el.getAttribute('data-ar');
      });
    }
  });
</script>
</body>
</html>
